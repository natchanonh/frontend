<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>USK SCHOOLMONEY - ชำระเงินหอพัก</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>body{font-family:'Prompt',sans-serif}</style></head>
<body class="bg-slate-100 min-h-screen">
<header class="bg-[#12296b] text-white p-4"><b>USK SCHOOLMONEY</b> โรงเรียนอุทยานศึกษากระบี่ — ระบบชำระเงินหอพัก</header>
<main class="max-w-2xl mx-auto p-4 space-y-4">
 <div id="bd" class="flex gap-3 overflow-x-auto"></div>
 <div class="bg-white rounded-xl p-4 shadow"><label class="block text-sm font-medium mb-1">ค้นหาชื่อนักเรียน</label>
  <div class="flex gap-2"><input id="q" class="flex-1 border rounded-lg px-3 py-2" placeholder="พิมพ์ชื่อ (อย่างน้อย 2 ตัวอักษร)"><button id="sq" class="bg-[#12296b] text-white rounded-lg px-4">ค้นหา</button></div><div id="rs" class="mt-3 space-y-2"></div></div>
 <div id="det"></div>
</main>
<div id="m" class="hidden fixed inset-0 bg-gray-800/80 items-center justify-center p-4 z-50"><div id="mb" class="bg-[#f9f8f4] w-full max-w-md rounded-2xl p-6 shadow-xl overflow-y-auto max-h-[90vh]"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDoc,getDocs,query,where,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const cfg={apiKey:"AIzaSyCYzdTDDtasgznuTERAtFz4l_dk47eB42A",authDomain:"schoolmonnyusk.firebaseapp.com",projectId:"schoolmonnyusk",storageBucket:"schoolmonnyusk.firebasestorage.app",messagingSenderId:"1005787782841",appId:"1:1005787782841:web:46389eb63de7f65affc568"};
const sb=createClient("https://ihagihlmaquzaniegcfp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloYWdpaGxtYXF1emFuaWVnY2ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Njc5NzgsImV4cCI6MjEwODM0Mzk3OH0.BVZ8LHRsJArrxWge7B69wjBzyWP8VqHGPoU6iKqSjlw"),BUCKET="usk";
const db=getFirestore(initializeApp(cfg));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={notdue:['ยังไม่ถึงกำหนด','text-indigo-500'],overdue:['ค้างชำระ','text-red-600'],pending:['รอตรวจสอบ','text-amber-500'],paid:['ชำระแล้ว','text-green-600'],partial:['ชำระบางส่วน','text-amber-700'],rejected:['ปฏิเสธหลักฐาน (ส่งใหม่ได้)','text-red-700'],cancelled:['ยกเลิกรายการ','text-gray-500']};
const PAYABLE=['notdue','overdue','rejected','partial'];
let bank={},terms={},tmr;
const showM=h=>{$('#mb').innerHTML=h;$('#m').classList.remove('hidden');$('#m').classList.add('flex')},hideM=()=>{clearInterval(tmr);$('#m').classList.add('hidden');$('#m').classList.remove('flex')};
/* PromptPay (EMVCo) แบบระบุยอดเงิน */
const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
const crc=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};
const ppay=(id,amt)=>{id=String(id).replace(/\D/g,'');const t=id.length>=13?'02':'01';if(t=='01'&&id.length==10)id='0066'+id.slice(1);
 const p=tlv('00','01')+tlv('01','12')+tlv('29',tlv('00','A000000677010111')+tlv(t,id))+tlv('53','764')+tlv('54',amt.toFixed(2))+tlv('58','TH')+'6304';return p+crc(p)};
(async()=>{
 try{bank=(await getDoc(doc(db,'bank','main'))).data()||{};
 (await getDocs(collection(db,'terms'))).docs.forEach(d=>terms[d.id]={id:d.id,...d.data()});
 const B=(await getDocs(collection(db,'board'))).docs.map(d=>d.data());
 $('#bd').innerHTML=B.map(x=>`<div class="min-w-[240px] bg-white rounded-xl shadow overflow-hidden"><img src="${esc(x.img)}" class="w-full h-40 object-cover" alt=""><p class="p-2 text-sm">${esc(x.text)}</p></div>`).join('')}catch(e){console.error(e)}})();
$('#sq').onclick=async()=>{const q=$('#q').value.trim();if(q.length<2)return;$('#det').innerHTML='';
 const S=(await getDocs(query(collection(db,'students'),where('name','>=',q),where('name','<=',q+'\uf8ff')))).docs.map(d=>({id:d.id,...d.data()})).filter(s=>terms[s.termId]?.visible);
 $('#rs').innerHTML=S.length?'<p class="text-sm text-gray-500">เลือกภาคเรียน / ปีการศึกษา</p>'+S.map(s=>`<button data-s="${s.id}" class="block w-full text-left border rounded-lg p-2 hover:bg-slate-50"><b>${esc(s.name)}</b> <span class="text-sm text-gray-500">${esc(s.dorm)} · ${esc(s.level)}</span><br><span class="text-sm">${esc(terms[s.termId].label)}</span></button>`).join(''):'ไม่พบรายชื่อ';
 $('#rs').onclick=e=>{const id=e.target.closest('[data-s]')?.dataset.s,s=S.find(x=>x.id==id);s&&show(s)}};
async function show(s){
 const t=terms[s.termId],mo=t.months||[];
 const F=(await getDocs(query(collection(db,'fees'),where('studentId','==',s.id)))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.type=='fee'?-1:mo.indexOf(a.month)+1)-(b.type=='fee'?-1:mo.indexOf(b.month)+1));
 $('#det').innerHTML=`<div class="bg-white rounded-xl p-4 shadow"><h2 class="font-semibold">${esc(s.name)}</h2><p class="text-sm text-gray-500 mb-2">${esc(t.label)} · ${esc(s.dorm)}</p>
 ${F.map(f=>{const rem=Math.max(0,(f.amount||0)-(f.paid||0)),can=PAYABLE.includes(f.status)&&rem>0;return `<label class="flex items-center gap-2 border-b py-2"><input type="checkbox" class="ck" value="${f.id}" ${can?'':'disabled'}><span class="flex-1">${f.type=='fee'?'ค่าธรรมเนียมหอพัก':'ค่าอาหารเดือน '+esc(f.month)}<br><small>ยอด ${f.amount||0} บาท${f.paid?` · ชำระแล้ว ${f.paid}`:''}</small></span><b class="${(ST[f.status]||ST.notdue)[1]}">${(ST[f.status]||ST.notdue)[0]}</b></label>`}).join('')||'ยังไม่มีรายการ'}
 <div class="flex justify-between items-center mt-3"><b>รวม <span id="tot">0.00</span> บาท</b><button id="pb" class="bg-[#dc3545] text-white rounded-lg px-4 py-2 disabled:opacity-40" disabled>ชำระเงินด้วย QR</button></div></div>`;
 const calc=()=>{const sel=[...document.querySelectorAll('.ck:checked')].map(c=>F.find(f=>f.id==c.value)),tot=sel.reduce((a,f)=>a+f.amount-(f.paid||0),0);$('#tot').textContent=tot.toFixed(2);$('#pb').disabled=!(tot>0);return {sel,tot}};
 $('#det').onchange=calc;$('#pb').onclick=()=>{const {sel,tot}=calc();pay(s,t,sel,tot)}}
function pay(s,t,sel,tot){
 if(!bank.accNo)return alert('ระบบยังไม่ได้ตั้งค่าบัญชีรับเงิน กรุณาติดต่อเจ้าหน้าที่');
 showM(`<h2 class="text-xl font-semibold text-gray-800">ยืนยันการชำระเงิน</h2><p class="text-sm text-gray-500 mb-3">สแกน QR ในแอปธนาคาร ยอดเงินจะขึ้นอัตโนมัติ</p>
 <div class="text-center"><h3 class="text-[#14225a] font-bold text-lg mb-2">PromptPay</h3><div class="bg-white p-2 inline-block border-4 border-gray-200 rounded-lg"><canvas id="qr"></canvas></div><br>
 <button id="sv" class="text-red-500 text-sm font-medium mt-2">บันทึก QR Code ลงเครื่อง</button><p class="text-xs text-gray-400">หากปุ่มไม่ทำงาน กรุณากดค้างที่ภาพเพื่อบันทึก</p></div>
 <div class="bg-white rounded-xl p-4 shadow-sm border my-4 text-sm"><div class="flex justify-between border-b pb-2 mb-2"><span>รหัสใช้งานได้ถึง</span><span class="text-red-500 font-medium" id="cd">05:00</span></div><div class="flex justify-between border-b pb-3 mb-3"><span>ยอดชำระสุทธิ</span><span class="text-lg font-bold">฿${tot.toFixed(2)}</span></div>
 <div class="text-center text-xs space-y-1"><p class="text-red-500">กรุณาตรวจสอบข้อมูลบัญชีให้ถูกต้องก่อนทำรายการ</p><p>ชื่อบัญชี: <b>${esc(bank.accName)}</b></p><p>ธนาคาร: <b>${esc(bank.bankName)}</b></p><p>หมายเลขพร้อมเพย์: <b>${esc(bank.accNo)}</b></p></div></div>
 <label class="block text-sm font-medium mb-2">แนบหลักฐานการโอนเงิน <span class="text-red-500">*</span></label><input type="file" id="sf" accept="image/*" class="text-sm mb-4">
 <button id="ok" class="w-full bg-[#dc3545] text-white font-medium py-3 rounded-lg shadow-md">ยืนยันการแจ้งชำระ</button><button id="cx" class="w-full text-gray-500 py-2 mt-2">ยกเลิกรายการ</button>`);
 QRCode.toCanvas($('#qr'),ppay(bank.accNo,tot),{width:192,margin:1});
 $('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#qr').toDataURL('image/png');a.download='promptpay-'+tot.toFixed(2)+'.png';a.click()};
 let sec=300;tmr=setInterval(()=>{sec--;$('#cd').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0)hideM()},1000);
 $('#cx').onclick=hideM;
 $('#ok').onclick=async()=>{const f=$('#sf').files[0];if(!f)return alert('กรุณาแนบหลักฐานการโอนเงิน');if(f.size>5e6)return alert('ไฟล์ใหญ่เกิน 5MB');$('#ok').disabled=true;$('#ok').textContent='กำลังส่ง...';
  try{const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))].map(b=>b.toString(16).padStart(2,'0')).join('');
   const path=`slips/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${f.name.split('.').pop()}`,{error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(error)throw error;
   const url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,gid=crypto.randomUUID(),b=writeBatch(db);
   sel.forEach(x=>{b.set(doc(collection(db,'payments')),{groupId:gid,feeId:x.id,studentId:x.studentId,studentName:x.studentName,dorm:x.dorm,termId:x.termId,termLabel:t.label,type:x.type,month:x.month,amount:x.amount-(x.paid||0),slipUrl:url,hash,status:'pending',createdAt:serverTimestamp(),history:[]});b.update(doc(db,'fees',x.id),{status:'pending'})});
   await b.commit();hideM();alert('ส่งหลักฐานแล้ว สถานะ "รอตรวจสอบ" จนกว่าเจ้าหน้าที่จะอนุมัติ');show(s)}catch(e){alert('ส่งไม่สำเร็จ: '+e.message);$('#ok').disabled=false;$('#ok').textContent='ยืนยันการแจ้งชำระ'}}}
</script></body></html>
